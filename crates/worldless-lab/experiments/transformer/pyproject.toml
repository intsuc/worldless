[project]
name = "worldless-transformer"
version = "0.1.0"
description = "Training and reference inference for the Worldless TinyStories transformer experiment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=0.34,<2",
    "numpy>=2.0,<3",
    "pyarrow>=21,<24",
    "torch>=2.8,<3",
]

[project.scripts]
worldless-transformer = "worldless_transformer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/worldless_transformer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
