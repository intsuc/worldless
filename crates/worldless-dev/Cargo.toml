[package]
name = "worldless-dev"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
rayon = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
toml = "0.9"
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
